name: Validate lexicon

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Sync built distribution
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- dist/lexicon.json; then
            echo "dist/lexicon.json is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/lexicon.json
          git commit -m "Sync built lexicon distribution"
          git push
